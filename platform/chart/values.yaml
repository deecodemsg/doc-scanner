# -- TriggerAuthentication values to be defined for use with KEDA ScaledObject
triggerAuthentication: []
  # enabled: true
  # name: incoming-trigger-auth
  # namespace: app-imps
  # -- To Enable or Disable PodIdentity 
  # podIdentity:
    # -- (String) Set to false to disable podIdentity
    # enabled: true 
    # -- (String) Supported Values are none | azure | azure-workload | aws | aws-eks | aws-kiam | gcp  # Optional. Default: none
    # provider: 
    # -- (String) # Optional. Only used by azure & azure-workload providers.
    # identityId: <identity-id>                                           
    # -- (String) # Optional. Only used by aws provider.
    # roleArn: <role-arn>               
    # -- (String) Supported Values are keda|workload|operator                                  
    # identityOwner: 
  # -- (String) To Define any secrets to be used for scaling
  # secret:
  #   enabled: false
    # -- [List] List of secrets to be defined for TrigerAuth
  #    items: []

global:
  # -- (string) Cloud Provider Type. Possible values: `gcp`, `azure`, `aws`
  cloud_provider: gcp
  # -- (list) List of Image Pull Secrets to be set for application pods.
  # <br />Format: <br />
  # `- name: docker-registry-secret`
  imagePullSecrets: []
  # - name: docker-registry-secret
  # -- (map) Application Container Environment Variables set at global level.
  # <br />Relevant for common variables that you need to set for all child charts in a parent chart
  env: {}
  # -- (map) Pod Monitoring Scrape Interval Configuration
  podMonitoring:
    # -- (string) Scrape interval to be set for scraping metrics to Promethues via PodMonitoring
    scrape_interval: 5s
  # -- (string) Comma Seperated List of Kafka Brokers.
  # <br />Format: `"KAFKA_BROKER_IP_1:KAFKA_BROKER_PORT,KAFKA_BROKER_IP_2:KAFKA_BROKER_PORT"`
  kafkaBrokers: ""
  # -- (string) Promethues Frontend URL used by Scaled Object / HPA to fetch metrics for promethues based triggers.
  prometheusFrontendUrl: ""
  # -- (bool) Should Scaled Object / HPA be created for pods autoscaling.
  autoscalingEnabled: false
  # -- (string) Should CPU and Memory Resource Requests Limits be set?
  resourceLimitsEnabled: "true"
  # -- (string) Should be set to false if headless service is not in use
  headlessService:
    enabled: false
    # -- (map) To Define any annotations for headless service
    annotations: {}
      # metrics.dynatrace.com/scrape: 'true'
      # metrics.dynatrace.com/secure: 'false'
      # metrics.dynatrace.com/path: /actuator/prometheus

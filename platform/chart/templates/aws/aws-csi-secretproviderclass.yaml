{{- if eq .Values.global.cloud_provider "aws" }}
{{- if and .Values.aws .Values.aws.secretProviderClass .Values.aws.secretProviderClass.enabled }}
{{- range $resourceName, $resourceData := .Values.aws.secretProviderClass.resources }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $resourceName }}
  {{- with $resourceData.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  provider: aws
  {{- if $resourceData.secretObjectsEnabled }}
  secretObjects:
  {{- range $secretName, $secretData := $resourceData.data }}
  - secretName: {{ $secretName }}
    type: Opaque
    data:
      {{- range $key, $val := $secretData }}
      - objectName: {{ $val.fileName }}
        key: {{ $val.k8sSecretKey }}
      {{- end }}
  {{- end }}
  {{- end }}
  parameters:
    objects:  |
      {{- range $secretName, $secretData := $resourceData.data }}
      {{- range $key, $val := $secretData }}
      - objectName: {{ $val.resourceName }}
        objectAlias: {{ $val.fileName }}
        objectType: {{ default "secretsmanager" $val.objectType }}
      {{- end }}
      {{- end }}
    {{- with $resourceData.additionalParameters }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}

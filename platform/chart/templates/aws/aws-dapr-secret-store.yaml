{{- if eq .Values.global.cloud_provider "aws" }}
{{- if and .Values.aws .Values.aws.secretStore .Values.aws.secretStore.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ default "aws-secret-manager" .Values.aws.secretStore.name }}
spec:
  type: secretstores.aws.secretmanager
  version: v1
  metadata:
  - name: region # Required
    value: {{ .Values.aws.secretStore.aws_region | quote }}
{{- end }}
{{- end }}

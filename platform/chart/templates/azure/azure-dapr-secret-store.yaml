{{- if eq .Values.global.cloud_provider "azure" }}
{{- if and .Values.azure .Values.azure.secretStore .Values.azure.secretStore.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ default "azure-secret-manager" .Values.azure.secretStore.name }}
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
  - name: vaultName # Required
    value: {{ .Values.azure.azure_keyvault_name | quote }}
  - name: azureEnvironment # Optional, defaults to AZUREPUBLICCLOUD
    value: "AZUREPUBLICCLOUD"
  # See authentication section below for all options
  - name: azureTenantId
    value: {{ .Values.azure.azure_tenant_id | quote }}
  - name: azureClientId
    value: {{ .Values.azure.azure_identity_client_id | quote }}
{{- end }}
{{- end }}

{{- if eq .Values.global.cloud_provider "azure" }}
{{- if and .Values.azure .Values.azure.secretProviderClass .Values.azure.secretProviderClass.enabled }}
{{- range $resourceName, $resourceData := .Values.azure.secretProviderClass.resources }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $resourceName }}
  {{- with $resourceData.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  provider: azure
  {{- if $resourceData.secretObjectsEnabled }}
  secretObjects:
  {{- range $secretName, $secretData := $resourceData.data }}
  - secretName: {{ $secretName }}
    type: Opaque
    data:
      {{- range $key, $val := $secretData }}
      - objectName: {{ $val.objectAlias | toYaml }}
        key: {{ $val.k8sSecretKey | toYaml }}
      {{- end }}
  {{- end }}
  {{- end }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    tenantId: {{ $.Values.azure.azure_tenant_id | quote }}        # The tenant ID of the key vault
    clientID: {{ $.Values.azure.azure_identity_client_id | quote }} # Setting this to use workload identity
    keyvaultName: {{ $.Values.azure.azure_keyvault_name | quote }}       # Set to the name of your key vault
    cloudName: ""                         # [OPTIONAL for Azure] if not provided, the Azure environment defaults to AzurePublicCloud
    objects:  |
      array:
      {{- range $secretName, $secretData := $resourceData.data }}
      {{- range $key, $val := $secretData }}
        - |
          objectName: {{ $val.objectName | toYaml }}
          objectAlias: {{ $val.objectAlias | toYaml }}
          objectType: {{ default "secret" $val.objectType | toYaml }}
          objectVersion: {{ default "" $val.objectVersion | toYaml }}
          {{- if $val.objectFormat }}
          objectFormat: {{ default "pem" $val.objectFormat | toYaml }}
          {{- end }}
          {{- if $val.objectEncoding }}
          objectEncoding: {{ default "utf-8" $val.objectEncoding | toYaml }}
          {{- end }}
        {{- end }}
        {{- end }}
    {{- with $resourceData.additionalParameters }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}

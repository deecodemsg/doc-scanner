{{- if eq .Values.global.cloud_provider "gcp" }}
{{- if and .Values.gcp .Values.gcp.secretStore }}
{{- with .Values.gcp.secretStore }}
{{- if .enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ default "gcp-secret-manager" .name }}
spec:
  type: secretstores.gcp.secretmanager
  version: v1
  metadata:
    - name: project_id
      value: {{ .projectId }}
{{- end }} 
{{- end }}
{{- end }}
{{- end }}

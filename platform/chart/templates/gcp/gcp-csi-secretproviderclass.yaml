{{- if eq .Values.global.cloud_provider "gcp" }}
{{- if and .Values.gcp .Values.gcp.secretProviderClass .Values.gcp.secretProviderClass.enabled }}
{{- range $resourceName, $resourceData := .Values.gcp.secretProviderClass.resources }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $resourceName }}
  {{- with $resourceData.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  provider: gcp
  {{- if $resourceData.secretObjectsEnabled }}
  secretObjects:
  {{- range $secretName, $secretData := $resourceData.data }}
  - secretName: {{ $secretName }}
    type: Opaque
    data:
      {{- range $key, $val := $secretData }}
      - objectName: {{ $val.fileName | toYaml }}
        key: {{ $val.k8sSecretKey | toYaml }}
      {{- end }}
  {{- end }}
  {{- end }}
  parameters:
    secrets: |
      {{- range $secretName, $secretData := $resourceData.data }}
      {{- range $key, $val := $secretData }}
      - resourceName: {{ $val.resourceName | toYaml }}
        fileName: {{ $val.fileName | toYaml }}
      {{- end }}
      {{- end }}
    {{- with $resourceData.additionalParameters }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}

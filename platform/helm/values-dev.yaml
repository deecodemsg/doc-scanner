# Development environment values
global:
  environment: development

replicaCount: 1

image:
  repository: web-twain-mfe
  pullPolicy: Always
  tag: "dev"

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: doc-scanner.dev.local
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: false

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

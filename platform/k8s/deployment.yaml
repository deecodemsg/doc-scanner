apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-scanner
  namespace: default
  labels:
    app: doc-scanner
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doc-scanner
  template:
    metadata:
      labels:
        app: doc-scanner
        version: v1
    spec:
      containers:
        - name: web-twain-mfe
          image: web-twain-mfe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
